<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="glow" cx="78%" cy="12%" r="70%">
      <stop offset="0" stop-color="#C19A3D" stop-opacity=".30"/>
      <stop offset="1" stop-color="#C19A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="8%" cy="88%" r="60%">
      <stop offset="0" stop-color="#33625C" stop-opacity=".34"/>
      <stop offset="1" stop-color="#33625C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6A24"/>
      <stop offset="1" stop-color="#DCBC69"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#17140F"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <!-- graph field -->
  <g stroke="#2B2618" stroke-width="1">
    <line x1="140" y1="150" x2="140" y2="530"/>
    <line x1="140" y1="530" x2="1060" y2="530"/>
    <line x1="140" y1="340" x2="1060" y2="340" stroke-dasharray="4 7"/>
    <line x1="140" y1="150" x2="1060" y2="150" stroke-dasharray="4 7"/>
  </g>

  <!-- linear reference -->
  <line x1="140" y1="530" x2="1060" y2="150" stroke="#3A3428" stroke-width="2" stroke-dasharray="7 8"/>

  <!-- the eased curve: cubic-bezier(0.16, 0.84, 0.3, 1), the Land curve -->
  <path d="M140,530 C287,210 416,150 1060,150" fill="none" stroke="url(#curve)" stroke-width="7" stroke-linecap="round"/>

  <!-- samples riding the curve -->
  <circle cx="140"  cy="530" r="9" fill="#DCBC69"/>
  <circle cx="300"  cy="288" r="7" fill="#DCBC69" opacity=".85"/>
  <circle cx="470"  cy="196" r="7" fill="#DCBC69" opacity=".7"/>
  <circle cx="700"  cy="164" r="7" fill="#DCBC69" opacity=".55"/>
  <circle cx="1060" cy="150" r="9" fill="#DCBC69"/>

  <!-- sparkle glints -->
  <g fill="#F6F0E4" opacity=".9">
    <path d="M905,232 L910,246 924,251 910,256 905,270 900,256 886,251 900,246 Z"/>
    <path d="M215,430 L219,441 230,445 219,449 215,460 211,449 200,445 211,441 Z" opacity=".7"/>
  </g>

  <text x="140" y="112" font-family="Inter,Helvetica,Arial,sans-serif" font-size="21" font-weight="600"
        letter-spacing="6" fill="#C19A3D">EPISODE 16</text>

  <text x="1060" y="470" text-anchor="end" font-family="Georgia,serif" font-size="150" fill="#F6F0E4">28</text>
  <text x="1060" y="516" text-anchor="end" font-family="Inter,Helvetica,Arial,sans-serif" font-size="23"
        font-weight="600" letter-spacing="9" fill="#B5AC9C">EXPRESSIONS</text>

  <text x="140" y="600" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#6B6355">
    setInterpolationTypeAtKey(i, BEZIER, BEZIER);
  </text>
</svg>
