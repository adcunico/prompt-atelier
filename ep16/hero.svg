<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="g1" cx="80%" cy="10%" r="72%">
      <stop offset="0" stop-color="#C19A3D" stop-opacity=".34"/>
      <stop offset="1" stop-color="#C19A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="6%" cy="92%" r="66%">
      <stop offset="0" stop-color="#33625C" stop-opacity=".40"/>
      <stop offset="1" stop-color="#33625C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6A24"/>
      <stop offset="0.55" stop-color="#C19A3D"/>
      <stop offset="1" stop-color="#DCBC69"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#17140F"/>
  <rect width="1200" height="675" fill="url(#g1)"/>
  <rect width="1200" height="675" fill="url(#g2)"/>

  <!-- graph field, kept faint so it never competes at card size -->
  <g stroke="#2B2618" stroke-width="1.5">
    <line x1="560" y1="150" x2="560" y2="560"/>
    <line x1="560" y1="560" x2="1120" y2="560"/>
  </g>
  <g stroke="#241F14" stroke-width="1.5" stroke-dasharray="5 9">
    <line x1="560" y1="200" x2="1120" y2="200"/>
    <line x1="560" y1="380" x2="1120" y2="380"/>
  </g>

  <!-- linear reference, then the eased curve over it -->
  <line x1="560" y1="560" x2="1120" y2="200" stroke="#3A3428" stroke-width="3" stroke-dasharray="9 10"/>
  <path d="M560,560 C640,300 720,214 1120,200" fill="none" stroke="url(#gc)"
        stroke-width="13" stroke-linecap="round"/>

  <circle cx="560"  cy="560" r="14" fill="#DCBC69"/>
  <circle cx="742"  cy="252" r="11" fill="#DCBC69" opacity=".8"/>
  <circle cx="1120" cy="200" r="14" fill="#DCBC69"/>

  <!-- sparkle glints, the detail form from the library -->
  <g fill="#F6F0E4">
    <path d="M966,318 L974,346 1002,354 974,362 966,390 958,362 930,354 958,346 Z" opacity=".92"/>
    <path d="M632,168 L637,186 655,191 637,196 632,214 627,196 609,191 627,186 Z" opacity=".6"/>
  </g>

  <!-- type block, sized to survive a 360px-wide card -->
  <text x="88" y="128" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700"
        letter-spacing="9" fill="#C19A3D">EPISODE 16</text>

  <text x="80" y="415" font-family="Georgia,'Times New Roman',serif" font-size="300"
        fill="#F6F0E4">28</text>

  <text x="88" y="495" font-family="Helvetica,Arial,sans-serif" font-size="46" font-weight="700"
        letter-spacing="7" fill="#DCBC69">EXPRESSIONS</text>

  <text x="88" y="560" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="400"
        letter-spacing="2" fill="#B5AC9C">Claude Code + After Effects</text>
</svg>
